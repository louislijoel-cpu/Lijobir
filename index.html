<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

          content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Harshitha </title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect"

        <div class="message-page-overlay">

        </div>

    </section>
<!-- =========================================
     PAGE 4 - FINAL WISH
========================================= -->

    <section id="finalSection" class="final-section">

    </section>
<audio id="birthdayMusic" loop>
